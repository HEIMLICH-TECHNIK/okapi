[package]
name = "okapi-workspace"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "30", default-features = false, features = ["webgl", "webgpu"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Location", "Storage", "UrlSearchParams", "Window"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = "debuginfo"
